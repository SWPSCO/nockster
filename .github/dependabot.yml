version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /examples/design-reference
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    cooldown:
      default-days: 14
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      capacitor:
        patterns: ['@capacitor/*']
        update-types: [minor, patch]
      typescript-eslint:
        patterns: ['@typescript-eslint/*', '@eslint/js', 'eslint']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
