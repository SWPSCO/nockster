name: Deploy web (GitHub Pages)

# Builds the web app and publishes it to GitHub Pages at https://my.nockster.com.
#
# The OTA release index + firmware assets are NOT bundled here — they live on
# Cloudflare R2 (published by the firmware-release workflow) and the app fetches
# them at runtime from https://bin.aeroe.io/nockster/updates/latest.json. That
# keeps web deploys (this workflow) from ever overwriting the release channel, so
# this only needs to run when the web sources change.
#
# NOTE: because the index/firmware are now fetched cross-origin, the R2 public
# domain (bin.aeroe.io) must send CORS headers allowing https://my.nockster.com
# (GET + the relevant headers). Configure a CORS rule on the swpsco bucket once.
#
# One-time setup in repo Settings:
#   - Pages -> Build and deployment -> Source: "GitHub Actions"
#   - Pages -> Custom domain: my.nockster.com  (the web/public/CNAME file pins it)
#   - DNS: CNAME my.nockster.com -> <owner>.github.io
#   - User manual is built with mdBook and published under /manual/

on:
  push:
    branches: [master]
    paths:
      - 'nockster-esp/web/**'
      - 'nockster-esp/manual/**'
      - 'nockster-esp/nockster-js/**'
      - 'nockster-esp/crates/nockster-wasm/**'
      - 'nockster-esp/crates/nockster-core/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: nockster-esp

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Rust (wasm) + wasm-pack
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nockster-esp/target
          key: wasm-${{ runner.os }}-${{ hashFiles('nockster-esp/Cargo.lock') }}
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || cargo install wasm-pack

      # The wasm crate pulls private SWPSCO git deps (tx-types, ...). Authenticate
      # cargo's git fetch with a scoped token (falls back to the default token).
      - name: Authenticate cargo to private git deps
        env:
          GH_DEPS_TOKEN: ${{ secrets.GH_DEPS_TOKEN || github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_DEPS_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      # Build the local workspace artifacts the web app consumes via file: deps.
      - name: Build wasm pkg
        run: wasm-pack build crates/nockster-wasm --target web --out-dir pkg

      - name: Build nockster-js
        working-directory: nockster-esp/nockster-js
        run: |
          npm ci
          npm run build

      - name: Build web app
        working-directory: nockster-esp/web
        env:
          # OTA index lives on R2 (published by the firmware-release workflow).
          # Overridable in-app (localStorage / advanced panel).
          VITE_NOCKSTER_RELEASE_INDEX_URL: https://bin.aeroe.io/nockster/updates/latest.json
          # GitHub Pages is static, so production calls the CORS-enabled edge RPC directly.
          VITE_NOCKBLOCKS_RPC_URL: https://nockblocks.com/rpc
        run: |
          npm ci
          npm run build

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.3 --locked

      - name: Build user manual
        working-directory: nockster-esp/manual
        run: mdbook build --dest-dir ../web/dist/manual

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: nockster-esp/web/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
