name: ESP protocol tests

on:
  push:
    branches: [master]
    paths: ['nockster-esp/**', '.github/workflows/esp-ci.yml']
  pull_request:
    paths: ['nockster-esp/**', '.github/workflows/esp-ci.yml']

defaults:
  run:
    working-directory: nockster-esp

jobs:
  # Protocol wire-format guard: the same golden fixture file is checked by
  # cargo (crates/nockster-core/tests/protocol_fixtures.rs) and by node
  # (nockster-js/test/protocol-fixtures.test.mjs), so Rust/TypeScript codec
  # drift fails one of these jobs instead of corrupting device traffic.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nockster-esp/target
          key: core-tests-${{ runner.os }}-${{ hashFiles('nockster-esp/Cargo.lock') }}

      # nockster-core pulls private SWPSCO git deps (tx-types, ...).
      - name: Authenticate cargo to private git deps
        env:
          GH_DEPS_TOKEN: ${{ secrets.GH_DEPS_TOKEN || github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_DEPS_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Run nockster-core tests
        run: cargo test -p nockster-core

  nockster-js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run nockster-js tests
        working-directory: nockster-esp/nockster-js
        run: |
          npm install
          npm test
