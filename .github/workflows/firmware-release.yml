name: Firmware release

# Builds + signs a Nockster firmware release INSIDE a container (docker/firmware/
# Dockerfile) for portability/reproducibility, then publishes a GitHub Release with:
#   - nockster-fw-v<N>.bin         (OTA app image; Secure Boot v2-signed for production)
#   - nockster-fw-v<N>.update.json (signed update bundle/manifest)
#   - latest.json                  (OTA release index; versioned relative asset URLs)
#
# These are ALSO published to Cloudflare R2 (r2:swpsco/nockster/updates/) and served
# at https://bin.aeroe.io/nockster/updates/latest.json. The web app fetches the index
# from there at runtime, so the OTA channel is decoupled from the GitHub Pages deploy
# (web commits to master no longer overwrite the release index).
#
# Trigger: push a tag `fw-v<N>` (N = integer release version baked into the image,
# e.g. `fw-v7`), or run manually.
#
# Required repo secrets:
#   UPDATE_SIGNING_KEY  — firmware update signing key (hex or raw, per nockster-cli).
#                         Must match the fixed on-device trust anchor below.
#   SECURE_BOOT_V2_KEY  — ESP32-S3 Secure Boot v2 RSA3072 PEM. Required for
#                         production releases so OTA app images boot on
#                         secure-booted boards.
#   RCLONE_B64          — base64-encoded rclone.conf with an `r2:` remote for the
#                         swpsco bucket (same secret used by other SWPSCO repos).

env:
  NOCKSTER_UPDATE_PUBKEY_SHA256_HEX: 5aa46209222080a2ce107e25d427c3d9ada6cb77be25d7d2a3df8959b7fa2602

on:
  push:
    tags: ['fw-v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Integer firmware release version (u32)'
        required: true
      build_profile:
        description: 'Build profile'
        type: choice
        default: production
        options: [production, chip-security, dev]

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + profile
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VER="${{ github.event.inputs.release_version }}"
            PROFILE="${{ github.event.inputs.build_profile }}"
            TAG="fw-v${VER}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#fw-v}"
            PROFILE="production"
          fi
          if ! [[ "$VER" =~ ^[0-9]+$ ]]; then
            echo "::error::release version must be an integer (got '$VER' from tag '$TAG')"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write signing keys (host, outside repo)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          SECURE_BOOT_V2_KEY: ${{ secrets.SECURE_BOOT_V2_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::missing repo secret UPDATE_SIGNING_KEY"
            exit 1
          fi
          printf '%s' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          if [ "${{ steps.meta.outputs.profile }}" = "production" ]; then
            if [ -z "$SECURE_BOOT_V2_KEY" ]; then
              echo "::error::missing repo secret SECURE_BOOT_V2_KEY"
              exit 1
            fi
            printf '%s' "$SECURE_BOOT_V2_KEY" > "$RUNNER_TEMP/secure-boot-v2-rsa.pem"
          else
            : > "$RUNNER_TEMP/secure-boot-v2-rsa.pem"
          fi

      - name: Build firmware builder image
        run: docker build -t nockster-fw -f docker/firmware/Dockerfile .

      - name: Build + sign firmware (in container, --release)
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GH_DEPS_TOKEN || github.token }}
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm \
            -e GIT_AUTH_TOKEN \
            -e RELEASE_VERSION="${{ steps.meta.outputs.version }}" \
            -e FW_PROFILE="${{ steps.meta.outputs.profile }}" \
            -e NOCKSTER_UPDATE_PUBKEY_SHA256_HEX \
            -v "$RUNNER_TEMP/signing.key:/keys/signing.key:ro" \
            -v "$RUNNER_TEMP/secure-boot-v2-rsa.pem:/keys/secure-boot-v2-rsa.pem:ro" \
            -v "$PWD/out:/out" \
            nockster-fw

      - name: Validate OTA artifact set
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          out = pathlib.Path("out")
          index_path = out / "latest.json"
          index = json.loads(index_path.read_text())
          firmware_url = index.get("firmware_url")
          bundle_url = index.get("bundle_url")
          if not isinstance(firmware_url, str) or "/" in firmware_url:
              sys.exit(f"unexpected firmware_url in latest.json: {firmware_url!r}")
          if not isinstance(bundle_url, str) or "/" in bundle_url:
              sys.exit(f"unexpected bundle_url in latest.json: {bundle_url!r}")
          if firmware_url == "nockster-fw.bin" or bundle_url == "nockster-fw.update.json":
              sys.exit("latest.json must reference versioned artifacts, not mutable legacy names")

          firmware_path = out / firmware_url
          bundle_path = out / bundle_url
          if not firmware_path.is_file():
              sys.exit(f"firmware artifact missing: {firmware_path}")
          if not bundle_path.is_file():
              sys.exit(f"bundle artifact missing: {bundle_path}")

          firmware = firmware_path.read_bytes()
          actual_sha = hashlib.sha256(firmware).hexdigest()
          expected_sha = index.get("image_sha256_hex")
          if actual_sha != expected_sha:
              sys.exit(f"firmware sha256 mismatch: latest.json expects {expected_sha}, got {actual_sha}")
          actual_size = len(firmware)
          expected_size = index.get("image_size")
          if actual_size != expected_size:
              sys.exit(f"firmware size mismatch: latest.json expects {expected_size}, got {actual_size}")

          print(f"validated {firmware_url}: {actual_size} bytes {actual_sha}")
          print(f"validated {bundle_url}")
          PY

      - name: Publish GitHub Release (host)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "out/nockster-fw-v${{ steps.meta.outputs.version }}.bin" \
            "out/nockster-fw-v${{ steps.meta.outputs.version }}.update.json" \
            out/latest.json \
            --title "Firmware ${{ steps.meta.outputs.tag }}" \
            --notes "Signed Nockster firmware — release version ${{ steps.meta.outputs.version }}, profile ${{ steps.meta.outputs.profile }}, trust anchor ${NOCKSTER_UPDATE_PUBKEY_SHA256_HEX}." \
            --generate-notes

      - name: Publish OTA assets to R2
        env:
          RCLONE_B64: ${{ secrets.RCLONE_B64 }}
        run: |
          if [ -z "$RCLONE_B64" ]; then
            echo "::error::missing repo secret RCLONE_B64"
            exit 1
          fi
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "$RCLONE_B64" | base64 -d > ~/.config/rclone/rclone.conf
          # Upload the immutable versioned assets first, then the mutable index
          # last, so the index never references an object that hasn't landed yet.
          rclone copy "out/nockster-fw-v${{ steps.meta.outputs.version }}.bin"         r2:swpsco/nockster/updates/ --progress
          rclone copy "out/nockster-fw-v${{ steps.meta.outputs.version }}.update.json" r2:swpsco/nockster/updates/ --progress
          rclone copy out/latest.json                                                r2:swpsco/nockster/updates/ --progress
