[package]
name = "nockster-desktop"
version = "1.0.8"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.1", features = [] }
serde_json = "1"
tempfile = "3"
tauri-plugin-http = "~2.6"
tauri-plugin-opener = "~2.5"
hidapi = "=2.6.3"
serde = { version = "1", features = ["derive"] }
