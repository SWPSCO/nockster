[package]
name = "nockster-desktop"
version = "1.1.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.1", features = [] }
serde_json = "1"
tempfile = "3"
tauri-plugin-http = "~2.6"
tauri-plugin-opener = "~2.5"
tauri-plugin-updater = "=2.12.0"
base64 = "0.22"
minisign-verify = "0.2"
hidapi = "=2.6.3"
serde = { version = "1", features = ["derive"] }
