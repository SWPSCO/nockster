openapi: 3.1.0
info:
  title: Nockchain JSON-RPC
  version: v0.1.0
  description: |
    RPC surface for Nockchain. Pokes and peeks over HTTP.
    The service implements JSON-RPC 2.0 over HTTP POST at `/rpc`.
    All requests and responses are `application/json` with a UTF-8 body.

servers:
  - url: https://nockblocks.com
    description: Mainnet RPC
  - url: http://127.0.0.1:3000
    description: Local development node

paths:
  /rpc:
    post:
      summary: Nockchain JSON-RPC endpoint
      operationId: rpc
      tags: [rpc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequestEnvelope"
            examples:
              getBlockByHeight:
                summary: Get block by height 1,2345
                value:
                  jsonrpc: "2.0"
                  method: getBlockByHeight
                  params: [12345]
                  id: 1
              getBlockByHeightWithPrevious:
                summary: Get block by height with 5 previous blocks
                value:
                  jsonrpc: "2.0"
                  method: getBlockByHeight
                  params: [12345, 5]
                  id: 1
              getBlocksByRange:
                summary: Get blocks from height 100 to 150
                value:
                  jsonrpc: "2.0"
                  method: getBlocksByRange
                  params: [100, 150]
                  id: 2
              getBlocksByTimestampRange:
                summary: Get blocks between timestamps
                value:
                  jsonrpc: "2.0"
                  method: getBlocksByTimestampRange
                  params: [1672531200, 1672617600]
                  id: 3
              getTip:
                summary: Get current chain tip
                value:
                  jsonrpc: "2.0"
                  method: getTip
                  params: []
                  id: "tip-42"
              getTransactionById:    
                summary: Get transaction by ID
                value:
                  jsonrpc: "2.0"
                  method: getTransactionById
                  params: [{"id": "2c8Ltbg44dPkEGcNPupcVAtDgD87753M9pG2fg8yC2mTEqg5qAFvvbT"}]
                  id: 3
              getTransactionsByAddress:
                summary: Get transactions for an address
                value:
                  jsonrpc: "2.0"
                  method: getTransactionsByAddress
                  params: [{"address": "32KVTmv3ofSyACq9nC1Hgnk4Jt8rs2hj1cvDZWC1EQuiYFMDg8MaLtF3ntafJbEUH5XPV1pK3K4xkxfjRPAWprBb7LYCVv4HF7817Bwh9M9xAdmgrPt77j4xejihNFd9h5Eo", "limit": 50, "offset": 0}]
                  id: 5
              getMiningPubkeys:
                summary: Get mining public keys
                value:
                  jsonrpc: "2.0"
                  method: getMiningPubkeys
                  params: []
                  id: 6
              isMainnet:
                summary: Check if running on mainnet
                value:
                  jsonrpc: "2.0"
                  method: isMainnet
                  params: []
                  id: 7
              submitTransaction:
                summary: Broadcast a raw transaction
                value:
                  jsonrpc: "2.0"
                  method: submitTransaction
                  params: ["base58encodedtransaction..."]
                  id: 99
              getBlockchainMetrics:
                summary: Get blockchain metrics for current tip
                value:
                  jsonrpc: "2.0"
                  method: getBlockchainMetrics
                  params: []
                  id: 8
              getBlockchainMetricsAtHeight:
                summary: Get blockchain metrics at specific height
                value:
                  jsonrpc: "2.0"
                  method: getBlockchainMetrics
                  params: [{"blockHeight": 5000}]
                  id: 9
              getTransactionsByBlockId:
                summary: Get transactions in a block by ID with pagination
                value:
                  jsonrpc: "2.0"
                  method: getTransactionsByBlockId
                  params: [{"id": "2c8Ltbg44dPkEGcNPupcVAtDgD87753M9pG2fg8yC2mTEqg5qAFvvbT", "limit": 50, "offset": 0}]
                  id: 10
              getTransactionsByBlockHeight:
                summary: Get transactions in a block by height with pagination
                value:
                  jsonrpc: "2.0"
                  method: getTransactionsByBlockHeight
                  params: [{"height": 12345, "limit": 50, "offset": 0}]
                  id: 11
              getAllTransactios:
                summary: Get all transactions with pagination
                value:
                  jsonrpc: "2.0"
                  method: getAllTransactions
                  params: [{"limit": 100, "offset": 200}]
                  id: 12
              getDecentralizationMetrics:
                summary: Get decentralization metrics over time
                value:
                  jsonrpc: "2.0"
                  method: getDecentralizationMetrics
                  params: [{"startHeight": 0, "endHeight": 50000, "windowSize": 1000, "dataPoints": 50}]
                  id: 13
              getNetworkHealthSummary:
                summary: Get current network health summary
                value:
                  jsonrpc: "2.0"
                  method: getNetworkHealthSummary
                  params: []
                  id: 14
              getMiningDecentralization:
                summary: Get mining decentralization time series
                value:
                  jsonrpc: "2.0"
                  method: getMiningDecentralization
                  params: [{"startHeight": 40000, "windowSize": 500, "dataPoints": 100}]
                  id: 15
              getWalletGrowthMetrics:
                summary: Get wallet growth metrics over time
                value:
                  jsonrpc: "2.0"
                  method: getWalletGrowthMetrics
                  params: [{"windowSize": 1000, "dataPoints": 50}]
                  id: 16
              getProofRateHistory:
                summary: Get history of proofrate per block including block time and adjustment ratio
                value:
                  jsonrpc: "2.0"
                  method: getProofRateHistory
                  params: [{"startHeight": 0, "endHeight": 16735, "smoothingType": "raw", "maxSamples": 1000}]
                  id: 17
              getNotes:
                summary: Get notes for an address
                value:
                  jsonrpc: "2.0"
                  method: getNotes
                  params: [{"address": "32KVTmv3ofSyACq9nC1Hgnk4Jt8rs2hj1cvDZWC1EQuiYFMDg8MaLtF3ntafJbEUH5XPV1pK3K4xkxfjRPAWprBb7LYCVv4HF7817Bwh9M9xAdmgrPt77j4xejihNFd9h5Eo"}]
                  id: 18
              getAddressesWithBalance:
                summary: Get a paginated list of all active addresses with their balance
                value:
                  jsonrpc: "2.0"
                  method: getAddressesWithBalance
                  params: [{"limit": 100, "offset": 200, "minBalance": 0}]
                  id: 19
      responses:
        "200":
          description: JSON-RPC success or error response
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: "*"
            Access-Control-Allow-Methods:
              schema:
                type: string
              example: "GET, POST, OPTIONS"
            Access-Control-Allow-Headers:
              schema:
                type: string
              example: "Content-Type, Accept, Authorization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponseEnvelope"
        "400":
          description: Transport-level error (malformed JSON, wrong content-type, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
        "default":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"

    options:
      summary: Handle CORS preflight requests
      operationId: rpcOptions
      tags: [rpc]
      responses:
        "200":
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: "*"
            Access-Control-Allow-Methods:
              schema:
                type: string
              example: "GET, POST, OPTIONS"
            Access-Control-Allow-Headers:
              schema:
                type: string
              example: "Content-Type, Accept, Authorization"
            Access-Control-Max-Age:
              schema:
                type: integer
              example: 86400
          content:
            text/plain:
              schema:
                type: string
                example: ""

components:
  schemas:
    JsonRpcRequestEnvelope:
      oneOf:
        - $ref: "#/components/schemas/GetBlockByHeightRequest"
        - $ref: "#/components/schemas/GetBlockByHashRequest"
        - $ref: "#/components/schemas/GetBlocksByRangeRequest"
        - $ref: "#/components/schemas/GetBlocksByTimestampRangeRequest"
        - $ref: "#/components/schemas/GetTipRequest"
        - $ref: "#/components/schemas/GetHeightRequest"
        - $ref: "#/components/schemas/GetTransactionByIdRequest"
        - $ref: "#/components/schemas/GetAllTransactionsRequest"
        - $ref: "#/components/schemas/GetTransactionsByAddressRequest"
        - $ref: "#/components/schemas/GetRawTransactionByIdRequest"
        - $ref: "#/components/schemas/GetBalanceByAddressRequest"
        - $ref: "#/components/schemas/GetMiningPubkeysRequest"
        - $ref: "#/components/schemas/GetHeavySummaryRequest"
        - $ref: "#/components/schemas/IsMainnetRequest"
        - $ref: "#/components/schemas/SubmitTransactionRequest"
        - $ref: "#/components/schemas/GetBlockchainMetricsRequest"
        - $ref: "#/components/schemas/GetTransactionsByBlockIdRequest"
        - $ref: "#/components/schemas/GetTransactionsByBlockHeightRequest"
        - $ref: "#/components/schemas/GetDecentralizationMetricsRequest"
        - $ref: "#/components/schemas/GetNetworkHealthSummaryRequest"
        - $ref: "#/components/schemas/GetMiningDecentralizationRequest"
        - $ref: "#/components/schemas/GetWalletGrowthMetricsRequest"
        - $ref: "#/components/schemas/GetNotesRequest"
        - $ref: "#/components/schemas/GetProofRateHistoryRequest"
        - $ref: "#/components/schemas/GetAddressesWithBalanceRequest"
      discriminator:
        propertyName: method
        mapping:
          getBlockByHeight: "#/components/schemas/GetBlockByHeightRequest"
          getBlockByHash: "#/components/schemas/GetBlockByHashRequest"
          getBlocksByRange: "#/components/schemas/GetBlocksByRangeRequest"
          getBlocksByTimestampRange: "#/components/schemas/GetBlocksByTimestampRangeRequest"
          getTip: "#/components/schemas/GetTipRequest"
          getHeight: "#/components/schemas/GetHeightRequest"
          getTransactionById: "#/components/schemas/GetTransactionByIdRequest"
          getAllTransactions: "#/components/schemas/GetAllTransactionsRequest"
          getTransactionsByAddress: "#/components/schemas/GetTransactionsByAddressRequest"
          getRawTransactionById: "#/components/schemas/GetRawTransactionByIdRequest"
          getBalanceByAddress: "#/components/schemas/GetBalanceByAddressRequest"
          getMiningPubkeys: "#/components/schemas/GetMiningPubkeysRequest"
          getHeavySummary: "#/components/schemas/GetHeavySummaryRequest"
          isMainnet: "#/components/schemas/IsMainnetRequest"
          submitTransaction: "#/components/schemas/SubmitTransactionRequest"
          getBlockchainMetrics: "#/components/schemas/GetBlockchainMetricsRequest"
          getTransactionsByBlockId: "#/components/schemas/GetTransactionsByBlockIdRequest"
          getTransactionsByBlockHeight: "#/components/schemas/GetTransactionsByBlockHeightRequest"
          getDecentralizationMetrics: "#/components/schemas/GetDecentralizationMetricsRequest"
          getNetworkHealthSummary: "#/components/schemas/GetNetworkHealthSummaryRequest"
          getMiningDecentralization: "#/components/schemas/GetMiningDecentralizationRequest"
          getWalletGrowthMetrics: "#/components/schemas/GetWalletGrowthMetricsRequest"
          getProofRateHistory: "#/components/schemas/GetProofRateHistoryRequest"
          getNotes: "#/components/schemas/GetNotesRequest"
          getAddressesWithBalance: "#/components/schemas/GetAddressesWithBalanceRequest"

    # Method-Specific Request Schemas
    GetBlockByHeightRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getBlockByHeight" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetBlockByHeightParams" }

    GetBlockByHashRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getBlockByHash" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetBlockByHashParams" }

    GetBlocksByRangeRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getBlocksByRange" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetBlocksByRangeParams" }

    GetBlocksByTimestampRangeRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getBlocksByTimestampRange" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetBlocksByTimestampRangeParams" }

    GetTipRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getTip" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/EmptyParams" }

    GetHeightRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getHeight" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/EmptyParams" }

    GetTransactionByIdRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getTransactionById" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetTransactionByIdParams" }

    GetAllTransactionsRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getAllTransactions" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetAllTransactionsParams" }

    GetTransactionsByAddressRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getTransactionsByAddress" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetTransactionsByAddressParams" }

    GetRawTransactionByIdRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getRawTransactionById" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetTransactionByIdParams" } # Reuses existing params

    GetBalanceByAddressRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getBalanceByAddress" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetTransactionByIdParams" } # Reuses IdParam via this schema

    GetMiningPubkeysRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getMiningPubkeys" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/EmptyParams" }

    GetHeavySummaryRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getHeavySummary" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/EmptyParams" }

    IsMainnetRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "isMainnet" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/EmptyParams" }

    SubmitTransactionRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "submitTransaction" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/SubmitTransactionParams" }

    GetBlockchainMetricsRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getBlockchainMetrics" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetBlockchainMetricsParams" }

    GetTransactionsByBlockIdRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getTransactionsByBlockId" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetTransactionsByBlockIdParams" }

    GetTransactionsByBlockHeightRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getTransactionsByBlockHeight" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetTransactionsByBlockHeightParams" }

    GetDecentralizationMetricsRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getDecentralizationMetrics" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetDecentralizationMetricsParams" }

    GetNetworkHealthSummaryRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getNetworkHealthSummary" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetNetworkHealthSummaryParams" }

    GetMiningDecentralizationRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getMiningDecentralization" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetMiningDecentralizationParams" }

    GetWalletGrowthMetricsRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getWalletGrowthMetrics" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetWalletGrowthMetricsParams" }

    GetProofRateHistoryRequest:
      type: object
      required: [jsonrpc, method, id, params]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getProofRateHistory" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetProofRateHistoryParams" }

    GetAddressesWithBalanceRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        method: { type: string, const: "getAddressesWithBalance" }
        id: { oneOf: [type: string, type: integer, type: "null"] }
        params: { $ref: "#/components/schemas/GetAddressesWithBalanceParams" }
        
    JsonRpcResponseEnvelope:
      description: |
        Standard JSON-RPC 2.0 response.
        Exactly **one** of `result` or `error` MUST appear.
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        tip:
          type: integer
          minimum: 0
          description: Current tip block height for this node
        result:
          description: Successful result payload (method-specific).
          oneOf:
            - $ref: "#/components/schemas/BlockObject"
            - $ref: "#/components/schemas/TipObject"
            - $ref: "#/components/schemas/HeightObject"
            - $ref: "#/components/schemas/TransactionObject"
            - $ref: "#/components/schemas/TransactionsResponse"
            - $ref: "#/components/schemas/RawTransactionObject"
            - $ref: "#/components/schemas/AddressTransactionsResponse"
            - $ref: "#/components/schemas/BlocksRangeResponse"
            - $ref: "#/components/schemas/BalanceObject"
            - $ref: "#/components/schemas/MiningPubkeysArray"
            - $ref: "#/components/schemas/HeavySummaryObject"
            - $ref: "#/components/schemas/BooleanResult"
            - $ref: "#/components/schemas/TransactionId"
            - $ref: "#/components/schemas/TransactionWithBlockInfo"
            - $ref: "#/components/schemas/DecentralizationMetricsResponse"
            - $ref: "#/components/schemas/NetworkHealthSummaryResponse"
            - $ref: "#/components/schemas/MiningDecentralizationResponse"
            - $ref: "#/components/schemas/WalletGrowthMetricsResponse"
            - $ref: "#/components/schemas/ProofRateHistoryResponse"
            - $ref: "#/components/schemas/NotesResponse"
            - $ref: "#/components/schemas/AddressesWithBalanceResponse"
        error:
          $ref: "#/components/schemas/JsonRpcError"
        id:
          description: Mirrors the `id` sent in the request
          oneOf:
            - type: string
            - type: integer
            - type: "null"

    JsonRpcError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Short description.
        data:
          description: Optional extra diagnostic information.
          nullable: true

    TransportError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          pattern: "^[0-9]{3}$"
          example: "400"
        message:
          type: string
        details:
          type: string
          nullable: true

    # Parameter wrapper types
    HeightParam:
      type: object
      required: [height]
      properties:
        height:
          type: integer
          minimum: 0

    HeightWithPreviousParam:
      type: object
      required: [height, previousCount]
      properties:
        height:
          type: integer
          minimum: 0
        previousCount:
          type: integer
          minimum: 0
          maximum: 100

    RangeParam:
      type: object
      required: [startHeight, endHeight]
      properties:
        startHeight:
          type: integer
          minimum: 0
        endHeight:
          type: integer
          minimum: 0

    TimestampRangeParam:
      type: object
      required: [startTimestamp, endTimestamp]
      properties:
        startTimestamp:
          type: integer
          minimum: 0
        endTimestamp:
          type: integer
          minimum: 0

    HashParam:
      type: object
      required: [hash]
      properties:
        hash:
          $ref: "#/components/schemas/BlockHash"

    AddressParam:
      type: object
      required: [address]
      properties:
        address:
          $ref: "#/components/schemas/Base58Address"

    IdParam:
      type: object
      required: [id]
      properties:
        id:
          type: string

    TransactionParam:
      type: object
      required: [rawTransaction]
      properties:
        rawTransaction:
          $ref: "#/components/schemas/RawTransactionBase58"

    AddressTransactionsParam:
      type: object
      required: [address]
      properties:
        address:
          $ref: "#/components/schemas/Base58Address"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of transactions to return
        offset:
          type: integer
          minimum: 0
          description: Number of transactions to skip (for pagination)
        minHeight:
          type: integer
          minimum: 0
          nullable: true
          description: Only include transactions from this block height onwards
        maxHeight:
          type: integer
          minimum: 0
          nullable: true
          description: Only include transactions up to this block height

    # Parameter sets using wrappers
    GetBlockByHeightParams:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: "#/components/schemas/HeightParam"

    GetBlockByHeightWithPreviousParams:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: "#/components/schemas/HeightWithPreviousParam"

    GetBlocksByRangeParams:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: "#/components/schemas/RangeParam"

    GetBlocksByTimestampRangeParams:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: "#/components/schemas/TimestampRangeParam"

    GetBlockByHashParams:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: "#/components/schemas/HashParam"

    GetTransactionsByAddressParams:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: "#/components/schemas/AddressTransactionsParam"

    GetTransactionByIdParams:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: "#/components/schemas/IdParam"

    GetTransactionsByBlockIdParams:
      type: array
