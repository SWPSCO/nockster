    SubmitTransactionParams:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: "#/components/schemas/TransactionParam"

    GetBlockchainMetricsParams:
      type: array
      minItems: 0
      maxItems: 1
      items:
        type: object
        properties:
          blockHeight:
            type: integer
